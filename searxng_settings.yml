  - name: wikiquote
    disabled: false
    timeout: 5.0
  - name: wikivoyage
    disabled: false
    timeout: 5.0
  - name: wolframalpha
    disabled: false
    timeout: 6.0
  - name: ddg definitions
    disabled: false
    timeout: 5.0
  - name: currency
    disabled: false
    timeout: 5.0

  # ═══════════════════════════════════════════════════════════════════
  # ACADEMIC / SCIENCE
