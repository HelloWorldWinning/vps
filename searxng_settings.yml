# Managed by 63. Persistent custom settings.
# Docs: https://docs.searxng.org/admin/settings/
#
# RULE THIS FILE FOLLOWS:
#   An entry written as `- name: <x>` with no `engine:` key is an OVERRIDE of an
#   engine that already exists in upstream searx/settings.yml. If <x> is not an
#   upstream engine name, SearXNG logs:
#       ERROR:searx.engines: The "engine" field is missing for the engine named "<x>"
#   Only write `engine:` + full definition when adding an engine upstream does NOT ship.

use_default_settings:
  engines:
    remove:
      # Onion engines: fail to load without a Tor proxy. Removing them silences
      # the two startup errors (ahmia / torch) that are unrelated to your config.
      - ahmia
      - torch
      # query.wikidata.org returns HTTP 403 to this host on the startup SPARQL
      # query, so the engine never registers — it only produces log noise.
      # Delete this line to try again if WMF stops blocking your egress IP.
      - wikidata

general:
  instance_name: "SearXNG"
  donation_url: false

server:
  # NOTE: the old key was pasted in plaintext -> rotate it.
  #   python -c "import secrets; print(secrets.token_hex(32))"
# secret_key: "REPLACE_WITH_NEW_64_HEX_CHARS"
  secret_key: "17da84ecb6e8720cb4e9e8c2c1882e2ff2bd429efe8f31c1e048458f41f5e205"
  image_proxy: true
  method: "GET"
  limiter: false

search:
  formats:
    - html
    - json

outgoing:
  request_timeout: 6.0
  max_request_timeout: 15.0
  pool_connections: 100
  pool_maxsize: 20
  enable_http2: true

valkey:
  url: redis://redis:6379/0

engines:

  # ═══════════════════════════════════════════════════════════════════
  # GENERAL WEB — primary crawlers / large indexes
  # ═══════════════════════════════════════════════════════════════════
  - name: google
    disabled: false
    timeout: 6.0
    weight: 1.3
  - name: bing
    disabled: false
    timeout: 5.0
    weight: 1.2
  - name: duckduckgo
    disabled: false
    timeout: 5.0
    weight: 1.2
  - name: brave
    disabled: false
    timeout: 5.0
    weight: 1.2
  - name: startpage
    disabled: false
    timeout: 6.0
  - name: qwant
    disabled: false
    timeout: 5.0
  - name: mojeek
    disabled: false
    timeout: 5.0
  - name: yahoo
    disabled: false
    timeout: 5.0

  # ═══════════════════════════════════════════════════════════════════
  # GENERAL WEB — independent indexes (small, low overlap, high signal)
  # ═══════════════════════════════════════════════════════════════════
  - name: marginalia
    disabled: false
    timeout: 6.0
  - name: mwmbl
    disabled: false
    timeout: 6.0
  - name: yep
    disabled: false
    timeout: 5.0

  # ═══════════════════════════════════════════════════════════════════
  # GENERAL WEB — regional
  # Expect intermittent 403 / captcha suspensions on yandex and baidu.
  # ═══════════════════════════════════════════════════════════════════
  - name: baidu
    disabled: false
    timeout: 6.0
  - name: naver
    disabled: false
    timeout: 6.0
  - name: seznam
    disabled: false
    timeout: 5.0
  - name: yandex
    disabled: false
