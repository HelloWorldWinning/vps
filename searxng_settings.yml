  # ═══════════════════════════════════════════════════════════════════
  # REFERENCE / KNOWLEDGE — answers and infoboxes
  # wikidata runs a SPARQL query at startup; query.wikidata.org rate-limits
  # datacenter IPs with HTTP 403. It self-retries after suspended_time.
  # If it never recovers on your host, add `wikidata` to the remove: list above.
  # ═══════════════════════════════════════════════════════════════════
  - name: wikipedia
    disabled: false
    timeout: 5.0
    weight: 1.3
  - name: wikidata
    disabled: false
    timeout: 6.0
  - name: wiktionary
    disabled: false
    timeout: 5.0
  - name: wikibooks
    disabled: false
